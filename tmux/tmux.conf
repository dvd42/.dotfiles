# ── Terminal & color ──────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-ghostty:Tc"
set -as terminal-features 'xterm-ghostty:extkeys'
set -as terminal-features ',xterm-ghostty:clipboard'
set -as terminal-features ',xterm-ghostty:hyperlinks'

# ── Core settings ─────────────────────────────────────
set -sg escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g set-clipboard on
set -g mouse on
set -g allow-passthrough on

# Window naming: ignore programs that try to rename (claude sets its process
# title to the version) and instead use the pane's cwd basename.
set -g allow-rename off
setw -g automatic-rename on
# Show last 3 path components (e.g. "permitting/worktrees/quick-test").
# Falls back to the full path when there aren't 3 components to extract.
setw -g automatic-rename-format '#{s|^.*/([^/]+/[^/]+/[^/]+)$|\1|:pane_current_path}'

# ── Extended keys (Shift+Enter for Claude Code) ──────
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
bind-key -T root S-Enter send-keys C-j

# ── Prefix: Ctrl+S ───────────────────────────────────
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# ── Splits (preserving working directory) ────────────
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind x kill-pane

# ── Window navigation ────────────────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind c new-window -c "#{pane_current_path}"

# Unbind layout presets (prefix+Alt+1-5) — too easy to fat-finger
unbind M-1
unbind M-2
unbind M-3
unbind M-4
unbind M-5

# ── smart-splits.nvim integration ────────────────────
# Seamless Ctrl+h/j/k/l navigation between tmux panes and nvim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Alt+h/j/k/l resize panes (also forwarded to nvim via smart-splits)
bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 3'

# ── Copy mode (vi keys, macOS clipboard via OSC 52) ──
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# ── Nvim popup (persistent per cwd, toggleable) ─────
# prefix+e: open nvim in a floating popup. Press again to close.
# Each cwd gets its own persistent nvim session.
bind e run-shell '~/.dotfiles/tmux/scripts/nvim_popup.sh "#{pane_current_path}" "#{session_name}"'

# ── Pane-visit tracking ──────────────────────────────
# Records a timestamp every time you enter a pane. The Claude dot script
# reads this to distinguish fresh-stopped sessions from ones you've been
# ignoring (latter get rendered red).
set-hook -g after-select-pane 'run-shell "~/.dotfiles/tmux/scripts/pane_seen.sh \"#{pane_id}\""'

# ── Fuzzy pickers ────────────────────────────────────
# prefix+w → window picker with Claude status dots (within current session)
bind w display-popup -E -w 60% -h 60% \
  "~/.dotfiles/tmux/scripts/window_picker.sh"

# prefix+W → session picker
bind W display-popup -E -w 60% -h 60% \
  "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs tmux switch-client -t"

# ── Reload config ────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Plugins (via TPM) ────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'timvw/tmux-assistant-resurrect'

# ── Plugin configuration ─────────────────────────────
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @continuum-boot 'on'

# ── Kanagawa-paper status bar (hand-rolled, no theme plugin) ──
# Palette (muted, matches kanagawa-paper.nvim):
#   bg   #18191a   surface  #2A2A37   dim      #727169   fg   #C5C9C5
#   peach #E6C384  mauve    #938AA9   green    #87A987   red  #C34043
#   pink  #D27E99  blue     #7E9CD8   teal     #7AA89F
set -g status-position top
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 200

set -g status-style "bg=default,fg=#8A8980"
set -g status-justify left

# ── Window status ────────────────────────────────────
set -g window-status-separator "  "
set -g window-status-format         "#[fg=#727169] #I #W #(~/.dotfiles/tmux/scripts/claude_window_dot.sh '#{session_name}:#{window_index}')"
set -g window-status-current-format "#[fg=#E6C384,bold] #I #W #(~/.dotfiles/tmux/scripts/claude_window_dot.sh '#{session_name}:#{window_index}')"
set -g window-status-activity-style "fg=#D27E99,none"

# ── Pane borders ─────────────────────────────────────
set -g pane-border-style        "fg=#54546D"
set -g pane-active-border-style "fg=#938AA9"

# ── Messages / mode ──────────────────────────────────
set -g message-style      "fg=#18191a,bg=#E6C384"
set -g message-command-style "fg=#18191a,bg=#938AA9"
set -g mode-style         "fg=#18191a,bg=#E6C384"

# ── Status left ──────────────────────────────────────
set -g status-left "#[fg=#938AA9,bold] #S #[fg=#54546D]│ "

# ── Status right: our custom Claude/git segments ────
set -g @claude_scripts '~/.dotfiles/tmux/scripts'

set -g status-right ""
# git branch (current pane)
set -ag status-right "#[fg=#E6C384]#(#{@claude_scripts}/git_branch.sh '#{pane_current_path}')   "

# ── Initialize TPM (MUST be last line) ───────────────
run '~/.tmux/plugins/tpm/tpm'
